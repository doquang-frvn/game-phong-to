<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Phóng To</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lora:ital,wght@0,600;0,700;1,500&display=swap">
<style>
  /* Hàng chọn vật thể như ngăn kéo mẫu vật; màn soi lớn; tầng sâu hiện trong kính lúp tròn nở dần; thước độ sâu bên dưới */
  :root {
    --stage: #0b0e22;
    --ink: #eceef7;
    --ink-dim: #a1a7c4;
    --rule: #2a3156;
    --panel: #141936;
    --electron: #8fd4ff;
    --amber: #f2a65a;
    --display: "Lora", Georgia, serif;
    --body: "Be Vietnam Pro", system-ui, -apple-system, sans-serif;
    color-scheme: dark;
  }
  body {
    background: var(--stage); color: var(--ink); font-family: var(--body);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 16px 32px;
  }
  [hidden] { display: none !important; }
  .wrap { max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .eyebrow { margin: 0; font-size: .74rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-dim); }
  h1 { margin: 2px 0 0; font-family: var(--display); font-weight: 700; font-size: clamp(1.35rem, 4.5vw, 1.8rem); text-wrap: balance; }

  .picker { display: grid; grid-template-columns: repeat(auto-fill, minmax(158px, 1fr)); gap: 8px; }
  .pick {
    font: inherit; color: var(--ink); text-align: left; cursor: pointer;
    background: var(--panel); border: 1px solid var(--rule); border-radius: 12px;
    padding: 9px 11px; display: flex; align-items: center; gap: 10px; min-width: 0;
  }
  .pick .sym {
    flex: 0 0 auto; width: 40px; height: 40px; border-radius: 8px; display: grid; place-items: center;
    font-family: var(--display); font-weight: 700; font-size: .92rem; color: #0b0e22; letter-spacing: -.02em;
  }
  .pick .nm { font-size: .88rem; font-weight: 500; min-width: 0; line-height: 1.25; }
  .pick .nm small { display: block; color: var(--ink-dim); font-size: .72rem; font-weight: 400; }
  .picker .grp { grid-column: 1 / -1; margin-top: 6px; }
  .picker .grp:first-child { margin-top: 0; }
  .pick:hover { border-color: var(--electron); }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .btn-pick { flex: 0 0 auto; background: var(--electron); color: #081022; border-color: var(--electron); font-weight: 700; font-size: .95rem; padding: 12px 18px; }
  .sheet { position: fixed; inset: 0; z-index: 30; background: rgba(4,6,18,.72); display: flex; align-items: flex-end; justify-content: center; }
  .sheet-card {
    width: min(980px, 100%); max-height: 86vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
    background: var(--panel); border: 1px solid var(--rule); border-radius: 20px 20px 0 0;
    padding: 16px 16px calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 12px;
  }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .sheet-head h2 { margin: 0; font-family: var(--display); font-size: 1.25rem; }
  .sheet-head .btn { flex: 0 0 auto; }
  .top-btns { display: flex; gap: 8px; flex: 0 0 auto; flex-wrap: wrap; justify-content: flex-end; }
  .btn-pt { font-weight: 700; font-size: .95rem; padding: 12px 16px; }
  .pt-card { width: min(1180px, 100%); }
  .pt-grid { display: grid; grid-template-columns: repeat(18, minmax(0, 1fr)); gap: 3px; }
  .pt-cell {
    position: relative; aspect-ratio: 1; border: 0; border-radius: 4px; cursor: pointer;
    font: inherit; font-size: clamp(8px, 1.5vw, 14px); font-weight: 700; color: #0e1428;
    display: flex; align-items: center; justify-content: center; padding: 0;
  }
  .pt-cell small { position: absolute; top: 1px; left: 3px; font-size: .55em; font-weight: 600; opacity: .75; }
  .pt-cell:focus-visible, .pt-cell.on { outline: 3px solid #fff; outline-offset: -1px; }
  .pt-gap { grid-column: span 1; }
  .pt-break { grid-column: 1 / -1; height: 6px; }
  .pt-modes { display: flex; gap: 6px; flex-wrap: wrap; }
  .pt-modes .chip[aria-pressed="true"] { background: var(--electron); color: #081022; border-color: var(--electron); }
  .cap-row { display: flex; justify-content: flex-start; margin-top: -4px; }
  .know-btn { font: inherit; font-weight: 700; font-size: .92rem; padding: 9px 16px; border-radius: 999px; cursor: pointer; color: var(--ink); background: rgba(143,212,255,.1); border: 1px solid rgba(143,212,255,.5); }
  .know-btn:hover { border-color: var(--electron); background: rgba(143,212,255,.18); }
  .know-btn .dots { display: inline-flex; gap: 4px; margin-left: 8px; vertical-align: middle; }
  .know-btn .dots i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .know-card { width: min(760px, 100%); }
  .know-sub { margin: -4px 0 0; color: var(--ink-dim); font-size: .9rem; }
  .know-list { display: flex; flex-direction: column; gap: 10px; }
  .know-item { border: 1px solid var(--rule); border-left: 5px solid var(--kc); border-radius: 12px; padding: 12px 14px; background: rgba(255,255,255,.03); }
  .know-item .tag { display: inline-block; font-size: .74rem; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: #081022; background: var(--kc); border-radius: 999px; padding: 2px 10px; margin-bottom: 6px; }
  .know-item p { margin: 0; line-height: 1.55; font-size: 1rem; }
  .know-try { border-radius: 12px; padding: 10px 14px; background: rgba(242,166,90,.14); color: #ffd6ad; font-size: .95rem; line-height: 1.5; }
  .pt-detail { border-top: 1px solid var(--rule); padding-top: 12px; display: flex; flex-direction: column; gap: 10px; }
  .pt-name { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .pt-name .sym2 { font-family: var(--display); font-size: 2rem; line-height: 1; padding: 6px 12px; border-radius: 10px; color: #0e1428; }
  .pt-name h3 { margin: 0; font-family: var(--display); font-size: 1.5rem; }
  .pt-name .eyebrow { margin: 0; }
  .pt-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .pt-chipline { display: flex; gap: 6px; flex-wrap: wrap; }
  .pt-tag { border: 1px solid var(--rule); border-radius: 999px; padding: 5px 12px; font-size: .9rem; color: var(--ink-dim); }
  .pt-tag b { color: var(--ink); }
  .pt-fact { margin: 0; color: var(--ink); line-height: 1.55; }
  .pt-sub { margin: 0; color: var(--ink-dim); line-height: 1.5; font-size: .95rem; }
  .pt-size { display: flex; align-items: flex-end; gap: 14px; }
  .pt-size figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: .8rem; color: var(--ink-dim); }
  .pt-dot { border-radius: 50%; }
  .btn-dive { background: var(--electron); border-color: var(--electron); color: #081022; font-weight: 700; align-self: flex-start; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 1px solid var(--rule); padding-bottom: 10px; }
  .tab { font: inherit; font-size: .95rem; font-weight: 600; color: var(--ink-dim); background: transparent; border: 1px solid var(--rule); border-radius: 999px; padding: 9px 16px; cursor: pointer; }
  .tab:hover { color: var(--ink); border-color: var(--electron); }
  .tab[aria-selected="true"] { background: var(--electron); border-color: var(--electron); color: #081022; }
  .tab:focus-visible { outline: 2px solid var(--electron); outline-offset: 2px; }
  .pick[aria-pressed="true"] { border-color: var(--electron); box-shadow: inset 0 0 0 1px var(--electron); }
  .pick:focus-visible { outline: 2px solid var(--electron); outline-offset: 2px; }
  @media (max-width: 460px) { .picker { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

  .stage {
    position: relative; width: 100%;
    height: min(66vh, calc(100vw - 32px)); min-height: 300px;
    border-radius: 16px; overflow: hidden; border: 1px solid var(--rule);
    background: var(--stage); touch-action: none; user-select: none; -webkit-user-select: none;
  }
  canvas#cv { display: block; width: 100%; height: 100%; }
  .hud { position: absolute; inset: 0 0 auto 0; padding: 12px 14px 28px; background: linear-gradient(rgba(8,10,26,.78), rgba(8,10,26,0)); pointer-events: none; }
  .lvl { font-family: var(--display); font-weight: 700; font-size: clamp(1.3rem, 4.2vw, 1.9rem); line-height: 1.15; text-shadow: 0 1px 8px rgba(0,0,0,.6); }
  .mag { margin-top: 3px; font-size: .86rem; color: var(--ink); opacity: .85; font-variant-numeric: tabular-nums; text-shadow: 0 1px 6px rgba(0,0,0,.7); }
  .hint { display: inline-block; margin-top: 7px; font-size: .78rem; font-weight: 500; padding: 3px 10px; border-radius: 999px; background: rgba(242,166,90,.2); color: #ffd6ad; }
  .count { position: absolute; left: 14px; bottom: 14px; pointer-events: none; font-size: .82rem; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
  .count b { color: var(--ink); font-size: 1rem; }
  .hold {
    position: absolute; right: 12px; bottom: 12px; font: inherit; font-weight: 700; font-size: 1rem;
    padding: 15px 22px; border-radius: 999px; border: 0; cursor: pointer;
    background: var(--electron); color: #081022; box-shadow: 0 4px 22px rgba(143,212,255,.35); touch-action: none;
  }
  .hold.on { background: var(--amber); box-shadow: 0 4px 22px rgba(242,166,90,.45); }
  .curr { left: auto; right: 14px; transform: none; }
  .curr[aria-pressed="true"] { background: var(--amber); box-shadow: 0 4px 22px rgba(242,166,90,.5); }
  .thermo { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; align-items: center; pointer-events: none; }
  .thermo-tube { width: 12px; height: clamp(90px, 22vh, 170px); background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.3); border-radius: 8px 8px 0 0; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; }
  .thermo-fill { width: 100%; height: 45%; background: linear-gradient(#ffb45a, #e4493f); transition: height .1s linear; }
  .thermo-txt { margin-top: 4px; font-size: .78rem; font-weight: 700; color: #ffd6ad; background: rgba(8,12,30,.75); border-radius: 6px; padding: 1px 5px; white-space: nowrap; }
  .thermo-bulb { width: 22px; height: 22px; border-radius: 50%; background: #e4493f; border: 1px solid rgba(255,255,255,.35); margin-top: -3px; }
  .hold:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .exc-btns { position: absolute; right: 12px; bottom: 80px; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
  .exc { font: inherit; font-weight: 700; font-size: .92rem; padding: 10px 16px; border-radius: 999px; cursor: pointer; color: var(--ink);
    background: rgba(16,20,46,.86); border: 1px solid rgba(143,212,255,.55); box-shadow: 0 3px 14px rgba(0,0,0,.35); }
  .exc:hover { border-color: var(--electron); }
  .exc[aria-pressed="true"] { background: var(--amber); color: #081022; border-color: var(--amber); }
  .exc:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

  .caption { margin: 0; min-height: 3em; font-family: var(--display); font-style: italic; font-weight: 500; font-size: clamp(1rem, 2.6vw, 1.15rem); line-height: 1.5; text-wrap: pretty; }

  .panel { background: var(--panel); border: 1px solid var(--rule); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
  .track { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .track .eyebrow { margin-right: 4px; }
  .chip { font: inherit; font-size: .8rem; color: var(--ink-dim); background: transparent; border: 1px solid var(--rule); border-radius: 999px; padding: 6px 11px; cursor: pointer; }
  .chip:hover { color: var(--ink); border-color: var(--electron); }
  .chip[aria-current="true"] { background: var(--electron); border-color: var(--electron); color: #081022; font-weight: 600; }
  .chip .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
  .chip:focus-visible, .btn:focus-visible { outline: 2px solid var(--electron); outline-offset: 2px; }
  input[type=range] { width: 100%; height: 30px; accent-color: var(--electron); }
  #tempSlider { flex: 1; width: auto; accent-color: #f2a65a; }
  input[type=range]:focus-visible { outline: 2px solid var(--electron); outline-offset: 4px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; }
  .btn { font: inherit; font-size: .88rem; font-weight: 500; color: var(--ink); background: transparent; border: 1px solid var(--rule); border-radius: 999px; padding: 10px 15px; cursor: pointer; flex: 1 1 auto; min-width: 0; }
  .btn:hover { border-color: var(--electron); }
  .btn[aria-pressed="true"] { background: var(--electron); color: #081022; border-color: var(--electron); font-weight: 600; }

  .lib { background: var(--panel); border: 1px solid var(--rule); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  .lib h2 { margin: 0; font-family: var(--display); font-size: 1.2rem; }
  .lib .intro { margin: 0; font-size: .88rem; line-height: 1.6; color: var(--ink-dim); max-width: 68ch; }
  .slot { display: grid; grid-template-columns: 88px 1fr; gap: 14px; padding-top: 14px; border-top: 1px solid var(--rule); }
  .slot .thumb { width: 88px; height: 88px; border-radius: 10px; overflow: hidden; border: 1px solid var(--rule); background: #000; }
  .slot .thumb img, .slot .thumb canvas { width: 100%; height: 100%; object-fit: cover; display: block; }
  .slot .body { min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  .slot .name { font-weight: 600; }
  .slot .state { font-size: .8rem; color: var(--ink-dim); }
  .slot .acts { display: flex; flex-wrap: wrap; gap: 8px; }
  .slot .acts .btn { flex: 0 0 auto; padding: 7px 13px; font-size: .82rem; }
  .slot label.btn { display: inline-block; }
  .slot input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  .slot input[type=file]:focus-visible + label { outline: 2px solid var(--electron); outline-offset: 2px; }
  .slot details summary { cursor: pointer; font-size: .84rem; color: var(--electron); }
  .slot textarea { width: 100%; box-sizing: border-box; min-height: 110px; margin-top: 8px; resize: vertical; font: inherit; font-size: .84rem; line-height: 1.55; color: var(--ink); background: var(--stage); border: 1px solid var(--rule); border-radius: 10px; padding: 10px; }
  .fixed-note { font-size: .84rem; color: var(--ink-dim); margin: 0; }
  @media (max-width: 460px) { .slot { grid-template-columns: 64px 1fr; } .slot .thumb { width: 64px; height: 64px; } }
</style>
<style>html,body{margin:0}img{max-width:100%}</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div>
      <p class="eyebrow">Game Phóng To · bản 19</p>
      <h1 id="objTitle">Cái đinh thép</h1>
    </div>
    <div class="top-btns">
      <button class="btn btn-pick" id="btnPick" type="button" aria-haspopup="dialog">Đổi vật thể</button>
      <button class="btn btn-pt" id="btnPT" type="button" aria-haspopup="dialog">Bảng tuần hoàn</button>
    </div>
  </header>

  <div class="sheet" id="ptSheet" hidden>
    <div class="sheet-card pt-card" role="dialog" aria-modal="true" aria-label="Bảng tuần hoàn">
      <div class="sheet-head">
        <h2 id="ptTitle">Bảng tuần hoàn — 118 nguyên tố</h2>
        <button class="btn" id="btnPTClose" type="button">Đóng</button>
      </div>
      <div class="pt-modes" role="group" aria-label="Tô màu bảng theo">
        <button class="chip" type="button" data-mode="nhom" aria-pressed="true">Nhóm chất</button>
        <button class="chip" type="button" data-mode="nang" aria-pressed="false">Nặng – nhẹ</button>
        <button class="chip" type="button" data-mode="to" aria-pressed="false">To – nhỏ</button>
        <button class="chip" type="button" data-mode="the" aria-pressed="false">Rắn – lỏng – khí</button>
      </div>
      <p class="pt-sub" id="ptLegend">Chạm vào một ô để xem nguyên tố đó.</p>
      <div class="pt-grid" id="ptGrid"></div>
      <div class="pt-detail" id="ptDetail" hidden></div>
    </div>
  </div>

  <div class="sheet" id="knowSheet" hidden>
    <div class="sheet-card know-card" role="dialog" aria-modal="true" aria-labelledby="knowTitle">
      <div class="sheet-head">
        <h2 id="knowTitle">Biết thêm</h2>
        <button class="btn" id="btnKnowClose" type="button">Đóng</button>
      </div>
      <p class="know-sub" id="knowSub"></p>
      <div class="know-list" id="knowList"></div>
    </div>
  </div>

  <div class="sheet" id="sheet" hidden>
    <div class="sheet-card" role="dialog" aria-modal="true" aria-label="Chọn vật thể">
      <div class="sheet-head">
        <h2>Soi gì tiếp đây?</h2>
        <button class="btn" id="btnSheetClose" type="button">Đóng</button>
      </div>
      <div class="tabs" id="tabs" role="tablist" aria-label="Chọn bộ sưu tập"></div>
      <div id="pickers"></div>
    </div>
  </div>

  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="hud">
      <div class="lvl" id="lvlName">Cái đinh</div>
      <div class="mag" id="mag">Kích thước thật</div>
      <div class="hint" id="hint" hidden>Kéo trên hình để xoay 3D</div>
    </div>
    <div class="count" id="count" hidden>Số lần phát hiện electron: <b id="countN">0</b></div>
    <div class="thermo" id="thermo" hidden aria-hidden="true"><div class="thermo-tube"><div class="thermo-fill" id="thermoFill"></div></div><div class="thermo-bulb"></div><div class="thermo-txt" id="thermoTxt" hidden></div></div>
    <div class="exc-btns" id="excBox" hidden>
      <button class="exc" id="btnUp" type="button" aria-pressed="false">✨ Cho năng lượng</button>
      <button class="exc" id="btnIon" type="button" aria-pressed="false">💥 Bứt electron</button>
    </div>
    <button class="hold" id="hold" type="button" hidden>Giữ để quay chậm</button>
    <button class="hold curr" id="currBtn" type="button" hidden aria-pressed="false">⚡ Bật điện</button>
  </div>

  <p class="caption" id="cap"></p>
  <div class="cap-row"><button class="know-btn" id="btnKnow" type="button">📚 Biết thêm<span class="dots" id="knowDots"></span></button></div>

  <div class="panel">
    <div class="track" id="elRow" hidden></div>
    <div class="track" id="tempRow" hidden></div>
    <div class="track" id="track"></div>
    <label for="zr" class="eyebrow">Độ sâu — kéo, hoặc chụm hai ngón trên hình</label>
    <input type="range" id="zr" min="-0.15" max="6.6" step="0.01" value="-0.15">
    <div class="row">
      <button class="btn" id="btnAuto" type="button" aria-pressed="false">Lặn tự động</button>
      <button class="btn" id="btnTop" type="button">Về vật thể</button>
      <button class="btn" id="btnSpeak" type="button" aria-pressed="false">Đọc to</button>
      <button class="btn" id="btnLib" type="button" aria-pressed="false">Thư viện ảnh</button>
    </div>
  </div>

  <section class="lib" id="lib" hidden>
    <h2 id="libTitle">Thư viện ảnh</h2>
    <p class="intro" id="libIntro"></p>
    <div id="slots"></div>
  </section>
</div>

<script>
(function () {
  'use strict';

  var Z = 8, ZMIN = -0.15, ZMAX = 6.6;

  function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function smooth(e0, e1, x) { var t = Math.max(0, Math.min(1, (x - e0) / (e1 - e0))); return t * t * (3 - 2 * t); }

  function gauss() { var u = 1 - Math.random(), v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(6.2832 * v); }
  function cellRand(i, j, k) {
    var h = (i * 374761393 + j * 668265263 + k * 1442695041) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  }

  // Vị trí phát hiện electron: phân bố xác suất dạng đám mây (r² e^-2r) trong không gian 3D
  function sampleCloud3(r) {
    var rad = -(Math.log(1 - r()) + Math.log(1 - r()) + Math.log(1 - r())) / 2;
    var u = 2 * r() - 1, th = 2 * Math.PI * r(), s = Math.sqrt(1 - u * u);
    return [rad * s * Math.cos(th), rad * s * Math.sin(th), rad * u];
  }

  // =====================================================================

  // =====================================================================

      cap: 'Một khối gỗ thông. Gỗ từng là một phần thân cây đang sống. Nó nhẹ, nổi được trên nước, mà lại rất dai. Phóng to vào xem vì sao.',
      pObj: 'Ảnh chụp cận cảnh một khối gỗ thông vuông, thấy rõ thớ gỗ trên mặt và vân vòng năm ở mặt cắt, đặt trên nền vải xanh thẫm, nhìn hơi chếch từ trên xuống. Ảnh vuông 1:1, chân thực, sắc nét, không có chữ.' },
    { id: 'giot-nuoc', name: 'Giọt nước', title: 'Giọt nước', short: 'giọt nước', mat: 'nuoc', frame: 0.025, draw: drawDrop,
      cap: 'Một giọt nước. Trong veo, tròn xoe, lăn được, đổ ra thì chảy. Phóng to vào xem nước làm từ gì.',
      pObj: 'Ảnh chụp cận cảnh một giọt nước tròn trong veo đọng trên mặt giấy xanh thẫm, ánh sáng mềm phản chiếu lấp lánh. Giọt nước nằm chính giữa khung hình. Ảnh vuông 1:1, chân thực, sắc nét, không có chữ.' },
    { id: 'qua-bong', name: 'Không khí', title: 'Không khí trong quả bóng', short: 'quả bóng', mat: 'khi', frame: 0.35, draw: drawBalloon,
      cap: 'Một quả bóng bay trong suốt. Bên trong chỉ có không khí — thứ mình không nhìn thấy mà vẫn thở mỗi ngày. Mình sẽ lao thẳng qua giữa quả bóng, vào bên trong khối không khí.',
      pObj: 'Ảnh chụp một quả bóng bay trong suốt căng tròn lơ lửng trên nền xanh thẫm, ánh sáng mềm viền quanh vỏ bóng. Quả bóng nằm chính giữa khung hình. Ảnh vuông 1:1, chân thực, sắc nét, không có chữ.' },
    { id: 'cuc-da', name: 'Cục đá lạnh', title: 'Cục đá lạnh', short: 'cục đá', mat: 'da', frame: 0.05, draw: drawIceCube,
      cap: 'Một viên đá lạnh. Vẫn là nước thôi, nhưng lạnh quá nên cứng lại. Phóng to vào xem các phân tử nước đang làm gì.',
      pObj: 'Ảnh chụp cận cảnh một viên đá lạnh hình khối vuông trong suốt, hơi mờ sương, có vài bọt khí nhỏ bên trong, đặt trên nền vải xanh thẫm, ánh sáng mềm. Viên đá nằm chính giữa khung hình. Ảnh vuông 1:1, chân thực, sắc nét, không có chữ.' },
    { id: 'hoi-nuoc', name: 'Hơi nước', title: 'Hơi nước bốc lên', short: 'làn hơi', mat: 'hoinuoc', frame: 0.2, draw: drawSteam, focus: [0.5, 0.47],
      cap: 'Làn khói trắng bốc lên từ cốc trà nóng. Bí mật: phần trắng con nhìn thấy là những giọt nước li ti vừa nguội lại. Hơi nước thật thì vô hình — nó bay ngay trên mặt trà, xen giữa các giọt. Mình lao vào đó.',
      pObj: 'Ảnh chụp một cốc trà thủy tinh nóng trên nền vải xanh thẫm, làn hơi nước trắng mỏng bốc lên uốn lượn phía trên miệng cốc, ánh sáng ngược mềm. Làn hơi ở nửa trên chính giữa khung hình. Ảnh vuông 1:1, chân thực, sắc nét, không có chữ.' },
    { id: 'bat-su', name: 'Bát sứ', title: 'Chiếc bát sứ', short: 'cái bát', surfWhat: 'men bát sứ', mat: 'su', frame: 0.14, draw: drawBowl,
      cap: 'Một cái bát sứ. Làm từ đất sét nung trong lò nóng hơn nghìn độ. Cứng, bóng, mà rơi là vỡ tan. Phóng to vào xem vì sao.',
      pObj: 'Ảnh chụp cận cảnh một chiếc bát sứ trắng trơn, men bóng, đặt úp nghiêng trên nền vải xanh thẫm, ánh sáng mềm. Bát nằm chính giữa khung hình. Ảnh vuông 1:1, chân thực, sắc nét, không có chữ.' },
    { id: 'hat-muoi', name: 'Hạt muối', title: 'Hạt muối ăn', short: 'hạt muối', mat: 'muoi', frame: 0.004, draw: drawSaltGrain,
      cap: 'Một hạt muối ăn. Nhìn kỹ xem: nó hình khối vuông! Không ai gọt đâu, tự nó mọc ra vuông như thế. Phóng to vào xem vì sao.',
      pObj: 'Ảnh chụp siêu cận cảnh hạt muối ăn trên nền vải xanh thẫm: các hạt hình khối lập phương trong suốt hơi trắng, cạnh sắc, một hạt to nằm chính giữa khung hình. Ảnh vuông 1:1, chân thực, sắc nét, không có chữ.' },
    { id: 'cuc-than', name: 'Than chì', title: 'Cục than chì', short: 'cục than', surfWhat: 'cục than', mat: 'than', frame: 0.07, draw: drawCoal,
      cap: 'Một cục than chì, thứ làm ruột bút chì. Đen, mềm, quệt lên giấy là để lại vết. Phóng to vào xem vì sao nó mềm thế.',
      pObj: 'Ảnh chụp cận cảnh một cục than đen nhánh, bề mặt vỡ có mặt phẳng bóng ánh kim xen mặt xù xì, đặt trên nền vải xanh thẫm, ánh sáng mềm. Cục than nằm chính giữa khung hình. Ảnh vuông 1:1, chân thực, sắc nét, không có chữ.' },
    { id: 'kim-cuong', name: 'Kim cương', title: 'Viên kim cương', short: 'viên kim cương', mat: 'kimcuong', frame: 0.02, draw: drawDiamond,
      cap: 'Một viên kim cương. Cứng nhất trong mọi vật chất tự nhiên. Và đây là bí mật: nó làm từ đúng thứ với ruột bút chì — than chì. Phóng to vào xem khác nhau ở đâu.',
      pObj: 'Ảnh chụp cận cảnh một viên kim cương cắt tròn trong suốt, các mặt cắt lấp lánh tia sáng nhiều màu, đặt trên nền vải xanh thẫm, ánh sáng mềm. Viên kim cương nằm chính giữa khung hình. Ảnh vuông 1:1, chân thực, sắc nét, không có chữ.' },

    // ----- MODULE SINH HỌC -----
    // sf: bề ngang khung của tầng nhìn gần; sv: kiểu nhìn; sd, hd: hình vẽ thay thế khi chưa có ảnh
    { id: 'thit-nac', name: 'Thịt nạc', title: 'Miếng thịt nạc', short: 'miếng thịt', mat: 'thitnac', frame: 0.1, draw: drawMeat, surfName: 'Thớ thịt', sf: 0.004, sv: 'camera', hd: tissue('muscle', 0.6),
      cap: 'Một miếng thịt bò nạc. Thịt nạc chính là cơ — thứ giúp con bò đi lại, cũng là thứ giúp con chạy nhảy. Phóng to vào xem cơ làm từ gì.',
      pObj: 'Ảnh vật thể: một miếng thịt bò nạc tươi màu đỏ hồng đặt trong đĩa sứ trắng, thấy rõ thớ thịt chạy song song trên mặt cắt, chụp kiểu ảnh ẩm thực. Miếng thịt nằm chính giữa khung hình. Ảnh vuông 1:1, chân thực, sắc nét, không có chữ.',
      pSurf: 'Ảnh cận cảnh mặt cắt thịt bò nạc: những thớ thịt đỏ chạy song song như bó sợi, có lớp màng mỏng trắng ngăn giữa các bó, hơi bóng ẩm. Phủ kín khung hình. Ảnh vuông 1:1, sắc nét, không có chữ.',
      pHat: 'Ảnh kính hiển vi quang học mặt cắt ngang cơ vân, nhuộm hồng tím: nhiều tế bào cơ hình đa giác xếp sát nhau thành bó, mỗi tế bào có vài nhân nhỏ tím đậm nằm sát mép, các bó ngăn bằng mô liên kết mảnh. Phủ kín khung hình. Ảnh vuông 1:1, sắc nét, không có chữ.' },
    { id: 'thit-mo', name: 'Thịt mỡ', title: 'Miếng mỡ', short: 'miếng mỡ', mat: 'thitmo', frame: 0.08, draw: drawFatPiece, surfName: 'Mặt cắt mỡ', sf: 0.004, sv: 'camera', hd: tissue('fat', 0.7),
      cap: 'Một miếng mỡ lợn. Mỡ là kho dự trữ năng lượng của cơ thể, lại giữ ấm như một lớp áo. Phóng to vào xem nó làm từ gì.',
      pObj: 'Ảnh vật thể: một miếng mỡ lợn trắng ngà, mặt cắt mịn hơi bóng, có một lớp da mỏng ở một cạnh, đặt trong đĩa sứ trắng, chụp kiểu ảnh ẩm thực. Miếng mỡ nằm chính giữa. Ảnh vuông 1:1, chân thực, sắc nét, không có chữ.',
      pSurf: 'Ảnh cận cảnh mặt cắt mỡ lợn: trắng ngà, mịn, hơi bóng dầu, có vài sợi màng mỏng chạy ngang. Phủ kín khung hình. Ảnh vuông 1:1, sắc nét, không có chữ.',
      pHat: 'Ảnh kính hiển vi quang học mô mỡ, nhuộm hồng tím nhạt: các tế bào mỡ to tròn trông như bọt xà phòng, ruột trắng rỗng, vách mỏng hồng, mỗi tế bào có một nhân tím dẹt bị ép sát vào vách. Phủ kín khung hình. Ảnh vuông 1:1, sắc nét, không có chữ.' },
    { id: 'trung', name: 'Lòng trắng trứng', title: 'Lòng trắng trứng', short: 'lòng trắng', mat: 'trung', frame: 0.12, draw: drawEggBowl, surfName: 'Lòng trắng', sf: 0.003, sv: 'camera',
      cap: 'Một quả trứng gà đập vào bát. Lòng trắng trong veo — vậy mà rán lên là trắng đục ngay. Phóng vào lòng trắng xem vì sao.',
      pObj: 'Ảnh vật thể: một quả trứng gà vừa đập vào bát sứ trắng, lòng đỏ tròn vàng cam, lòng trắng trong suốt hơi sánh bao quanh. Phần lòng trắng trong suốt nằm chính giữa khung hình. Ảnh vuông 1:1, chân thực, sắc nét, không có chữ.',
      pSurf: 'Ảnh cận cảnh lòng trắng trứng sống: trong suốt, sánh, có bọt khí nhỏ và vệt sánh đặc hơn, ánh sáng xuyên qua. Phủ kín khung hình. Ảnh vuông 1:1, sắc nét, không có chữ.' },
    { id: 'soi-toc', name: 'Sợi tóc', title: 'Sợi tóc', short: 'sợi tóc', mat: 'toc', frame: 0.06, draw: drawHair, surfName: 'Vảy tóc', sf: 3e-4, hd: tissue('hairx', 0.5),
      cap: 'Một lọn tóc. Mỗi sợi chỉ dày khoảng một phần mười milimét, vậy mà một sợi treo được cả quả trứng gà. Phóng vào một sợi xem vì sao nó dai thế.',
      pObj: 'Ảnh vật thể: một lọn tóc đen óng của người Việt, buộc gọn, nằm uốn nhẹ trên nền vải nhung xanh thẫm. Lọn tóc nằm chính giữa. Ảnh vuông 1:1, chân thực, sắc nét, không có chữ.',
      pSurf: 'Ảnh kính hiển vi điện tử một sợi tóc người nằm chéo khung hình: bề mặt phủ những vảy mỏng chồng lên nhau như ngói lợp nhà, mép vảy hơi vểnh. Tông xám tô màu nâu nhạt. Sợi tóc phủ gần kín khung. Ảnh vuông 1:1, sắc nét, không có chữ.',
      pHat: 'Ảnh kính hiển vi điện tử mặt cắt ngang một sợi tóc người: vòng vảy mỏng ở ngoài cùng, bên trong là bó sợi dày đặc xếp song song nhìn từ đầu cắt. Tông xám tô màu nâu nhạt. Mặt cắt chiếm gần kín khung. Ảnh vuông 1:1, sắc nét, không có chữ.' },
    { id: 'lan-da', name: 'Làn da', title: 'Làn da', short: 'làn da', mat: 'landa', frame: 0.1, draw: drawHand, surfName: 'Vảy da', sf: 4e-4, hd: drawCollagenNet,
      cap: 'Mu bàn tay. Da là bộ áo giáp bọc kín người con: chống nước, chặn vi khuẩn, kéo căng được rồi lại bật về. Phóng to vào xem.',
      pObj: 'Ảnh cận cảnh mu bàn tay người lớn đặt trên nền vải nhung xanh thẫm, thấy rõ các vân da nhỏ và lỗ chân lông, ánh sáng mềm. Phần mu tay nằm chính giữa. Ảnh vuông 1:1, chân thực, sắc nét, không có chữ.',
      pSurf: 'Ảnh kính hiển vi điện tử bề mặt da người: những vảy da mỏng dẹt chồng lên nhau như lá khô, có rãnh vân da chạy chéo. Tông xám tô màu hồng nhạt. Phủ kín khung hình. Ảnh vuông 1:1, sắc nét, không có chữ.',
      pHat: 'Ảnh kính hiển vi điện tử mạng sợi collagen trong da: rất nhiều sợi dài đan chéo nhau như lưới mềm, mỗi sợi có vằn ngang mờ. Tông xám tô màu kem nhạt. Phủ kín khung hình. Ảnh vuông 1:1, sắc nét, không có chữ.' },
    { id: 'te-bao', name: 'Tế bào má', title: 'Tế bào má', short: 'lam kính', mat: 'tebao', frame: 0.07, draw: drawSlide, surfName: 'Tế bào má', sf: 2e-4, sd: tissue('cheek', 0.8),
      cap: 'Một lam kính. Quệt nhẹ tăm bông vào má trong, quệt lên kính rồi nhỏ một giọt thuốc nhuộm xanh. Trên giọt xanh ấy có tế bào của chính người đó! Phóng vào xem.',
      pObj: 'Ảnh vật thể: một lam kính hiển vi bằng thủy tinh có một giọt nhuộm xanh tím nhỏ ở giữa, đặt trên nền vải nhung xanh thẫm, ánh sáng mềm. Giọt nhuộm nằm chính giữa khung hình. Ảnh vuông 1:1, chân thực, sắc nét, không có chữ.',
      pSurf: 'Ảnh kính hiển vi quang học tế bào niêm mạc má người nhuộm xanh methylene: vài tế bào dẹt hình đa giác bờ mềm nằm rải rác, mỗi tế bào có một nhân tròn xanh đậm ở giữa, nền xanh nhạt. Một tế bào nằm ngay chính giữa khung hình. Ảnh vuông 1:1, sắc nét, không có chữ.' },

    // ----- MODULE VI SINH -----
    { id: 'con-kien', name: 'Con kiến', title: 'Con kiến', short: 'con kiến', mat: 'kien', frame: 0.015, draw: drawAnt, surfName: 'Đầu kiến', sf: 1.5e-3, hd: tissue('eye', 0.45),
      cap: 'Một con kiến: 6 chân, 2 râu gập khúc, thân chia 3 phần đầu, ngực, bụng. Nó nhấc được vật nặng gấp nhiều lần mình. Phóng vào đầu kiến xem.',
      pObj: 'Ảnh macro một con kiến đen đang bò trên mép chiếc lá xanh, nhìn nghiêng, thấy rõ 6 chân, 2 râu gập khúc và 3 phần đầu–ngực–bụng. Con kiến nằm chính giữa khung hình, nền xanh thẫm mờ. Ảnh vuông 1:1, chân thực, sắc nét, không có chữ.',
      pSurf: 'Ảnh kính hiển vi điện tử đầu một con kiến nhìn thẳng: hai mắt kép ở hai bên, đôi râu gập khúc, hàm răng cưa, bề mặt phủ lông cứng nhỏ. Tô màu nâu cam nhẹ trên nền đen. Đầu kiến chiếm gần kín khung. Ảnh vuông 1:1, sắc nét, không có chữ.',
      pHat: 'Ảnh kính hiển vi điện tử cận cảnh mắt kép của kiến: hàng trăm mắt nhỏ hình lục giác xếp khít như tổ ong, cong theo mặt cầu, có lông mảnh mọc giữa các mắt. Tô màu nâu cam nhẹ. Phủ kín khung hình. Ảnh vuông 1:1, sắc nét, không có chữ.' },
    { id: 'mat-bui', name: 'Mạt bụi', title: 'Con mạt bụi trong chăn', short: 'góc chăn', mat: 'matbui', frame: 0.03, draw: drawBlanket, surfName: 'Con mạt bụi', sf: 5e-4,
      cap: 'Một góc chăn. Trông sạch sẽ, nhưng ở đây có hàng nghìn con vật tí hon đang sống mà mắt mình không thấy được. Phóng vào xem.',
      pObj: 'Ảnh chụp cận cảnh một góc chăn bông trên giường, những sợi vải và vài hạt bụi lấp lánh trong vệt nắng chiếu xiên. Vùng vải có bụi nằm chính giữa khung hình. Ảnh vuông 1:1, chân thực, sắc nét, không có chữ.',
      pSurf: 'Ảnh kính hiển vi điện tử một con mạt bụi nhà: thân tròn mập hơi trong, 8 chân có lông, không có mắt, đang bám giữa các sợi vải. Tô màu kem vàng nhạt trên nền đen. Con mạt nằm chính giữa, chiếm phần lớn khung. Ảnh vuông 1:1, sắc nét, không có chữ.' },
    { id: 'gau-nuoc', name: 'Gấu nước', title: 'Gấu nước trong rêu', short: 'cụm rêu', mat: 'gaunuoc', frame: 0.03, draw: drawMoss, surfName: 'Gấu nước', sf: 8e-4,
      cap: 'Một cụm rêu ẩm. Trong rêu có một con vật tí hon lì lợm nhất thế giới. Phóng vào tìm nó nhé.',

  // =====================================================================
  // Kết cấu dựng bằng code (tạo một lần, lưu lại)
  // =====================================================================
  function makeSurfaceTile(n, base) {
    var c = canvas(n), g = c.getContext('2d'), r = mulberry32(7), i, ox, oy;
    g.fillStyle = rgb(base); g.fillRect(0, 0, n, n);
    for (i = 0; i < 650; i++) {
      var x = r() * n, y = r() * n, rad = 2 + r() * 26, light = r() < 0.5;
      g.fillStyle = light ? 'rgba(255,255,255,' + (0.02 + r() * 0.05) + ')' : 'rgba(0,0,0,' + (0.02 + r() * 0.06) + ')';
      for (ox = -n; ox <= n; ox += n) for (oy = -n; oy <= n; oy += n) { g.beginPath(); g.arc(x + ox, y + oy, rad, 0, 6.2832); g.fill(); }
    }
    for (i = 0; i < 320; i++) {
      var sx = r() * n, sy = r() * n, len = 30 + r() * 420, ang = (r() - 0.5) * 0.25, lt = r() < 0.55;
      g.strokeStyle = lt ? 'rgba(255,255,255,' + (0.08 + r() * 0.25) + ')' : 'rgba(0,0,0,' + (0.08 + r() * 0.28) + ')';
      g.lineWidth = 0.4 + r() * 1.8;
      for (ox = -n; ox <= n; ox += n) for (oy = -n; oy <= n; oy += n) {
        g.beginPath(); g.moveTo(sx + ox, sy + oy); g.lineTo(sx + ox + Math.cos(ang) * len, sy + oy + Math.sin(ang) * len); g.stroke();
      }
    }
    return c;
  }
  function makeGrainTile(n, base, hv) {
    var c = canvas(n), g = c.getContext('2d'), r = mulberry32(21);
    var cells = 8, cs = n / cells, seeds = [], cols = [], x, y, i, j;
    for (j = 0; j < cells; j++) {
      seeds[j] = []; cols[j] = [];
      for (i = 0; i < cells; i++) {
        seeds[j][i] = [cs * (0.15 + r() * 0.7), cs * (0.15 + r() * 0.7)];
        var k = 0.72 + r() * 0.5, t = (r() - 0.5) * hv;
        cols[j][i] = [base[0] * k + t, base[1] * k, base[2] * k - t * 0.8, r() * 6.28];
      }
    }
    var img = g.createImageData(n, n), d = img.data;
    for (y = 0; y < n; y++) for (x = 0; x < n; x++) {
      var gx = Math.floor(x / cs), gy = Math.floor(y / cs), d1 = 1e9, d2 = 1e9, bc = null, bx = 0, by = 0;
      for (var dy = -1; dy <= 1; dy++) for (var dx = -1; dx <= 1; dx++) {
        var ci = ((gx + dx) % cells + cells) % cells, cj = ((gy + dy) % cells + cells) % cells;
        var sx = (gx + dx) * cs + seeds[cj][ci][0], sy = (gy + dy) * cs + seeds[cj][ci][1];
        var dd = Math.hypot(x - sx, y - sy);
        if (dd < d1) { d2 = d1; d1 = dd; bc = cols[cj][ci]; bx = sx; by = sy; } else if (dd < d2) d2 = dd;
      }
      var edge = smooth(0, 2.6, d2 - d1);
      var shade = 1 + 0.08 * Math.cos(bc[3]) * (x - bx) / cs + 0.08 * Math.sin(bc[3]) * (y - by) / cs;
      var kk = (0.3 + 0.7 * edge) * shade, o = (y * n + x) * 4, nz = (r() - 0.5) * 7;
      d[o] = clamp(bc[0] * kk + nz, 0, 255); d[o + 1] = clamp(bc[1] * kk + nz, 0, 255); d[o + 2] = clamp(bc[2] * kk + nz, 0, 255); d[o + 3] = 255;
    }
    g.putImageData(img, 0, 0);
    return c;
  }
  // tế bào gỗ: vách sáng màu mật ong, ruột rỗng tối
  function makeCellTile(n) {
    var c = canvas(n), g = c.getContext('2d'), r = mulberry32(41), i, j, cs = n / 8;
    g.fillStyle = '#c98a3a'; g.fillRect(0, 0, n, n);
    for (j = 0; j < 8; j++) for (i = 0; i < 8; i++) {
      var w = cs * (0.62 + r() * 0.16), h = cs * (0.62 + r() * 0.16);
      var x = i * cs + (cs - w) / 2 + (r() - 0.5) * cs * 0.08, y = j * cs + (cs - h) / 2 + (r() - 0.5) * cs * 0.08;
      var gr = g.createRadialGradient(x + w / 2, y + h / 2, 2, x + w / 2, y + h / 2, w * 0.7);
      gr.addColorStop(0, '#4a2508'); gr.addColorStop(1, '#7a4214');
      g.fillStyle = gr; g.beginPath(); g.roundRect(x, y, w, h, cs * 0.18); g.fill();
      g.strokeStyle = 'rgba(255,220,150,0.5)'; g.lineWidth = 2; g.stroke();
    }
    return c;

    libEl.hidden = !open;
    btnLib.setAttribute('aria-pressed', open ? 'true' : 'false');
    if (open) { renderSlots(); libEl.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  });
  function thumbCanvas(idx) {
    var c = canvas(176), g = c.getContext('2d'), v = { W: 176, H: 176, cx: 88, cy: 88, M: 176, HD: 124.5 };
    try { LEVELS[idx].draw(g, v, idx === 0 ? 0.75 : 1, performance.now() / 1000); } catch (e) {}
    return c;
  }
  function renderSlots() {
    if (libEl.hidden) return;
    slotsEl.textContent = '';
    LEVELS.forEach(function (Lv, idx) {
      var row = document.createElement('div'); row.className = 'slot';
      var th = document.createElement('div'); th.className = 'thumb';
      var im = Lv.img && images[key(Lv.id)];
      if (im) { var ii = document.createElement('img'); ii.alt = ''; ii.src = im.img.src; th.appendChild(ii); }
      else th.appendChild(thumbCanvas(idx));
      var body = document.createElement('div'); body.className = 'body';
      var nm = document.createElement('div'); nm.className = 'name'; nm.textContent = (idx + 1) + '. ' + Lv.name; body.appendChild(nm);
      if (!Lv.img) {
        var fx = document.createElement('p'); fx.className = 'fixed-note'; fx.textContent = Lv.fixed || ''; body.appendChild(fx);
      } else {
        var st = document.createElement('div'); st.className = 'state';
        st.textContent = im ? (im.own ? 'Đang dùng ảnh của anh' : 'Đang dùng ảnh trong thư mục') : 'Đang dùng hình vẽ bằng code';
        body.appendChild(st);
        var acts = document.createElement('div'); acts.className = 'acts';
        var fin = document.createElement('input'); fin.type = 'file'; fin.accept = 'image/*'; fin.id = 'file-' + cur.id + '-' + Lv.id;
        var lab = document.createElement('label'); lab.className = 'btn'; lab.htmlFor = fin.id; lab.textContent = im ? 'Đổi ảnh' : 'Chọn ảnh';
        fin.addEventListener('change', function () {
          var file = fin.files && fin.files[0];
          if (!file) return;
          idbPut(key(Lv.id), file);
          setOwnImage(key(Lv.id), file);
        });
        acts.appendChild(fin); acts.appendChild(lab);
        if (im && im.own) {
          var del = document.createElement('button'); del.type = 'button'; del.className = 'btn'; del.textContent = 'Bỏ ảnh của anh';
          del.addEventListener('click', function () {
            var k = key(Lv.id);
            idbDel(k);
            if (images[k] && images[k].url) { try { URL.revokeObjectURL(images[k].url); } catch (e) {} }
            delete images[k]; folderTried[cur.id] = false; loadFolderImages(); renderSlots();
          });
          acts.appendChild(del);
        }
        body.appendChild(acts);
        if (Lv.prompt) {
          var det = document.createElement('details');
          var sm = document.createElement('summary'); sm.textContent = 'Lệnh vẽ ảnh này bằng ChatGPT';
          var ta = document.createElement('textarea'); ta.readOnly = true; ta.value = Lv.prompt; ta.id = 'prompt-' + cur.id + '-' + Lv.id;
          var cp = document.createElement('button'); cp.type = 'button'; cp.className = 'btn'; cp.textContent = 'Chép lệnh'; cp.style.marginTop = '8px';
          cp.addEventListener('click', function () {
            function fallback() { ta.focus(); ta.select(); cp.textContent = 'Đã bôi đen, bấm Ctrl+C'; }
            try { navigator.clipboard.writeText(Lv.prompt).then(function () { cp.textContent = 'Đã chép'; setTimeout(function () { cp.textContent = 'Chép lệnh'; }, 1800); }, fallback); }
            catch (e) { fallback(); }
          });
          det.appendChild(sm); det.appendChild(ta); det.appendChild(cp);
          body.appendChild(det);
        }
      }
      row.appendChild(th); row.appendChild(body);
      slotsEl.appendChild(row);
    });
  }

  // =====================================================================
  // Vòng lặp
  // =====================================================================
  var lastT = 0;
  function frame(ms) {
    requestAnimationFrame(frame);
    var now = ms / 1000, dt = lastT ? Math.min(now - lastT, 0.05) : 0.016;
    lastT = now;
    z += (target - z) * Math.min(1, dt * (auto.on ? 1.15 : 4.5));
    if (Math.abs(target - z) < 0.0005) z = target;
    runAuto(now);
    updateRot(dt);
    var st = curMat.structure;
    if (st === 'water' && z > 0.6) liqStep(dt);
    if ((st === 'air' || st === 'steam') && z > -0.2) gasStep(dt);
    if (st === 'bio') {
      musC += ((contracting ? 1 : 0) - musC) * Math.min(1, dt * 2.5);
      fatMelt += (smooth(0.45, 0.95, tempVal) - fatMelt) * Math.min(1, dt * 0.8);
      if (cur.mat === 'trung' && tempVal > 0.75) eggCook = Math.min(1, eggCook + dt * 0.3);
    }
    updateElectrons(dt, now, z > ATOM - 1.6 && z < ATOM + 1.6);
    if (z > ATOM + 0.3 && z < ATOM + 2.1 && Math.random() < dt * 2.5) blips.push({ x: Math.random(), y: Math.random(), b: now });
    for (var i = blips.length - 1; i >= 0; i--) if (now - blips[i].b > 0.5) blips.splice(i, 1);
    render(now);
    updateHud();
  }

  buildTempRow();
  selectObject(0);
  window.addEventListener('resize', resize);
  resize();
  updateHud();
  requestAnimationFrame(frame);
  idbOpen().then(function () { idbLoadAll(function (k, blob) { if (String(k).indexOf(':') > 0) setOwnImage(String(k), blob); }); });
})();
</script>
