<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Game Phóng To</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lora:ital,wght@0,600;0,700;1,500&display=swap">
<style>
  /* Hàng chọn vật thể như ngăn kéo mẫu vật; màn soi lớn; tầng sâu hiện trong kính lúp tròn nở dần; thước độ sâu bên dưới */
  :root {
    --stage: #0b0e22;
    --ink: #eceef7;
    --ink-dim: #a1a7c4;
    --rule: #2a3156;
    --panel: #141936;
    --electron: #8fd4ff;
    --amber: #f2a65a;
    --display: "Lora", Georgia, serif;
    --body: "Be Vietnam Pro", system-ui, -apple-system, sans-serif;
    color-scheme: dark;
  }
  body {
    background: var(--stage); color: var(--ink); font-family: var(--body);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 16px 32px;
  }
  [hidden] { display: none !important; }
  .wrap { max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .eyebrow { margin: 0; font-size: .74rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-dim); }
  h1 { margin: 2px 0 0; font-family: var(--display); font-weight: 700; font-size: clamp(1.35rem, 4.5vw, 1.8rem); text-wrap: balance; }

  .picker { display: grid; grid-template-columns: repeat(auto-fill, minmax(158px, 1fr)); gap: 8px; }
  .pick {
    font: inherit; color: var(--ink); text-align: left; cursor: pointer;
    background: var(--panel); border: 1px solid var(--rule); border-radius: 12px;
    padding: 9px 11px; display: flex; align-items: center; gap: 10px; min-width: 0;
  }
  .pick .sym {
    flex: 0 0 auto; width: 40px; height: 40px; border-radius: 8px; display: grid; place-items: center;
    font-family: var(--display); font-weight: 700; font-size: .92rem; color: #0b0e22; letter-spacing: -.02em;
  }
  .pick .nm { font-size: .88rem; font-weight: 500; min-width: 0; line-height: 1.25; }
  .pick .nm small { display: block; color: var(--ink-dim); font-size: .72rem; font-weight: 400; }
  .picker .grp { grid-column: 1 / -1; margin-top: 6px; }
  .picker .grp:first-child { margin-top: 0; }
  .pick:hover { border-color: var(--electron); }
  .pick[aria-pressed="true"] { border-color: var(--electron); box-shadow: inset 0 0 0 1px var(--electron); }
  .pick:focus-visible { outline: 2px solid var(--electron); outline-offset: 2px; }
  @media (max-width: 460px) { .picker { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

  .stage {
    position: relative; width: 100%;
    height: min(66vh, calc(100vw - 32px)); min-height: 300px;
    border-radius: 16px; overflow: hidden; border: 1px solid var(--rule);
    background: var(--stage); touch-action: none; user-select: none; -webkit-user-select: none;
  }
  canvas#cv { display: block; width: 100%; height: 100%; }
  .hud { position: absolute; inset: 0 0 auto 0; padding: 12px 14px 28px; background: linear-gradient(rgba(8,10,26,.78), rgba(8,10,26,0)); pointer-events: none; }
  .lvl { font-family: var(--display); font-weight: 700; font-size: clamp(1.3rem, 4.2vw, 1.9rem); line-height: 1.15; text-shadow: 0 1px 8px rgba(0,0,0,.6); }
  .mag { margin-top: 3px; font-size: .86rem; color: var(--ink); opacity: .85; font-variant-numeric: tabular-nums; text-shadow: 0 1px 6px rgba(0,0,0,.7); }
  .hint { display: inline-block; margin-top: 7px; font-size: .78rem; font-weight: 500; padding: 3px 10px; border-radius: 999px; background: rgba(242,166,90,.2); color: #ffd6ad; }
  .count { position: absolute; left: 14px; bottom: 14px; pointer-events: none; font-size: .82rem; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
  .count b { color: var(--ink); font-size: 1rem; }
  .hold {
    position: absolute; right: 12px; bottom: 12px; font: inherit; font-weight: 700; font-size: 1rem;
    padding: 15px 22px; border-radius: 999px; border: 0; cursor: pointer;
    background: var(--electron); color: #081022; box-shadow: 0 4px 22px rgba(143,212,255,.35); touch-action: none;
  }
  .hold.on { background: var(--amber); box-shadow: 0 4px 22px rgba(242,166,90,.45); }
  .hold:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

  .caption { margin: 0; min-height: 3em; font-family: var(--display); font-style: italic; font-weight: 500; font-size: clamp(1rem, 2.6vw, 1.15rem); line-height: 1.5; text-wrap: pretty; }

  .panel { background: var(--panel); border: 1px solid var(--rule); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
  .track { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .track .eyebrow { margin-right: 4px; }
  .chip { font: inherit; font-size: .8rem; color: var(--ink-dim); background: transparent; border: 1px solid var(--rule); border-radius: 999px; padding: 6px 11px; cursor: pointer; }
  .chip:hover { color: var(--ink); border-color: var(--electron); }
  .chip[aria-current="true"] { background: var(--electron); border-color: var(--electron); color: #081022; font-weight: 600; }
  .chip .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
  .chip:focus-visible, .btn:focus-visible { outline: 2px solid var(--electron); outline-offset: 2px; }
  input[type=range] { width: 100%; height: 30px; accent-color: var(--electron); }
  input[type=range]:focus-visible { outline: 2px solid var(--electron); outline-offset: 4px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; }
  .btn { font: inherit; font-size: .88rem; font-weight: 500; color: var(--ink); background: transparent; border: 1px solid var(--rule); border-radius: 999px; padding: 10px 15px; cursor: pointer; flex: 1 1 auto; min-width: 0; }
  .btn:hover { border-color: var(--electron); }
  .btn[aria-pressed="true"] { background: var(--electron); color: #081022; border-color: var(--electron); font-weight: 600; }

  .lib { background: var(--panel); border: 1px solid var(--rule); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  .lib h2 { margin: 0; font-family: var(--display); font-size: 1.2rem; }
  .lib .intro { margin: 0; font-size: .88rem; line-height: 1.6; color: var(--ink-dim); max-width: 68ch; }
  .slot { display: grid; grid-template-columns: 88px 1fr; gap: 14px; padding-top: 14px; border-top: 1px solid var(--rule); }
  .slot .thumb { width: 88px; height: 88px; border-radius: 10px; overflow: hidden; border: 1px solid var(--rule); background: #000; }
  .slot .thumb img, .slot .thumb canvas { width: 100%; height: 100%; object-fit: cover; display: block; }
  .slot .body { min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  .slot .name { font-weight: 600; }
  .slot .state { font-size: .8rem; color: var(--ink-dim); }
  .slot .acts { display: flex; flex-wrap: wrap; gap: 8px; }
  .slot .acts .btn { flex: 0 0 auto; padding: 7px 13px; font-size: .82rem; }
  .slot label.btn { display: inline-block; }
  .slot input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  .slot input[type=file]:focus-visible + label { outline: 2px solid var(--electron); outline-offset: 2px; }
  .slot details summary { cursor: pointer; font-size: .84rem; color: var(--electron); }
  .slot textarea { width: 100%; box-sizing: border-box; min-height: 110px; margin-top: 8px; resize: vertical; font: inherit; font-size: .84rem; line-height: 1.55; color: var(--ink); background: var(--stage); border: 1px solid var(--rule); border-radius: 10px; padding: 10px; }
  .fixed-note { font-size: .84rem; color: var(--ink-dim); margin: 0; }
  @media (max-width: 460px) { .slot { grid-template-columns: 64px 1fr; } .slot .thumb { width: 64px; height: 64px; } }
</style>
<style>html,body{margin:0}img{max-width:100%}</style>
</head>
<body>

<div class="wrap">
  <header>
    <p class="eyebrow">Game Phóng To</p>
    <h1 id="objTitle">Cái đinh thép</h1>
  </header>

  <div class="picker" id="picker" role="group" aria-label="Chọn vật thể"></div>

  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="hud">
      <div class="lvl" id="lvlName">Cái đinh</div>
      <div class="mag" id="mag">Kích thước thật</div>
      <div class="hint" id="hint" hidden>Kéo trên hình để xoay 3D</div>
    </div>
    <div class="count" id="count" hidden>Số lần phát hiện electron: <b id="countN">0</b></div>
    <button class="hold" id="hold" type="button" hidden>Giữ để quay chậm</button>
  </div>

  <p class="caption" id="cap"></p>

  <div class="panel">
    <div class="track" id="elRow" hidden></div>
    <div class="track" id="tempRow" hidden></div>
    <div class="track" id="track"></div>
    <label for="zr" class="eyebrow">Độ sâu — kéo, hoặc chụm hai ngón trên hình</label>
    <input type="range" id="zr" min="-0.15" max="6.6" step="0.01" value="-0.15">
    <div class="row">
      <button class="btn" id="btnAuto" type="button" aria-pressed="false">Lặn tự động</button>
      <button class="btn" id="btnTop" type="button">Về vật thể</button>
      <button class="btn" id="btnSpeak" type="button" aria-pressed="false">Đọc to</button>
      <button class="btn" id="btnLib" type="button" aria-pressed="false">Thư viện ảnh</button>
    </div>
  </div>

  <section class="lib" id="lib" hidden>
    <h2 id="libTitle">Thư viện ảnh</h2>
    <p class="intro" id="libIntro"></p>
    <div id="slots"></div>
  </section>
</div>

<script>
(function () {
  'use strict';

  var Z = 8, ZMIN = -0.15, ZMAX = 6.6;

  function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function smooth(e0, e1, x) { var t = Math.max(0, Math.min(1, (x - e0) / (e1 - e0))); return t * t * (3 - 2 * t); }

  function cellRand(i, j, k) {
    var h = (i * 374761393 + j * 668265263 + k * 1442695041) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;

  };
  var PALS = {
    blue:   { c: ['205,250,255', '60,212,255', '28,112,255'], g: ['80,205,255', '40,150,255', '30,110,255'], chip: '#3cd4ff' },
    pink:   { c: ['255,230,238', '255,120,160', '205,45,95'], g: ['255,130,170', '230,70,120', '190,40,90'], chip: '#ff78a0' },

  function makeSurfaceTile(n, base) {

      for (ox = -n; ox <= n; ox += n) for (oy = -n; oy <= n; oy += n) { g.beginPath(); g.arc(x + ox, y + oy, rad, 0, 6.2832); g.fill(); }
    }
    for (i = 0; i < 320; i++) {

      g.strokeStyle = lt ? 'rgba(255,255,255,' + (0.08 + r() * 0.25) + ')' : 'rgba(0,0,0,' + (0.08 + r() * 0.28) + ')';
      g.lineWidth = 0.4 + r() * 1.8;

        var k = 0.72 + r() * 0.5, t = (r() - 0.5) * hv;

      for (var dy = -1; dy <= 1; dy++) for (var dx = -1; dx <= 1; dx++) {

        octx.fillStyle = g; octx.fillRect(0, 0, V.W, V.H);
        octx.globalCompositeOperation = 'source-over';
        if (foc < 1) ctx.filter = 'blur(' + (6 * (1 - foc)).toFixed(1) + 'px)';
        ctx.globalAlpha = a; ctx.drawImage(off, 0, 0, V.W, V.H); ctx.globalAlpha = 1;
        ctx.filter = 'none';
        var ra = 0.45 * a * (1 - smooth(0.7, 0.95, f));
        if (ra > 0.01) { ctx.strokeStyle = 'rgba(190,228,255,' + ra + ')'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(V.cx, V.cy, r * 0.86, 0, 6.2832); ctx.stroke(); }
      }
    }
    // viền thị kính ở tầng soi hiển vi quang học
    var vc = cur0.view === 'micro' ? 1 : 0, vn = nxt ? (nxt.view === 'micro' ? 1 : 0) : vc;
    var vig = vc + (vn - vc) * smooth(0.45, 0.95, Math.max(0, f));
    if (vig > 0.02) { ctx.globalAlpha = vig; ctx.drawImage(vigCv, 0, 0, V.W, V.H); ctx.globalAlpha = 1; }
    // rời thiết bị quang học sang mô hình mô phỏng: màn tối đi một nhịp như lúc đổi thiết bị
    if (nxt && optical && nxt.view === 'sim') {
      var dk = 0.5 * Math.sin(Math.PI * smooth(0.25, 0.95, f));
      if (dk > 0.02) { ctx.fillStyle = 'rgba(3,5,14,' + dk + ')'; ctx.fillRect(0, 0, V.W, V.H); }
    }
  }

  // =====================================================================
  // Chữ hiển thị
  // =====================================================================
  function fmtNum(x) {
    if (x < 10) { var r = Math.round(x * 10) / 10; return (r % 1 === 0 ? String(r) : r.toFixed(1)).replace('.', ','); }
    return String(Math.round(x));
  }
  function fmtMag(m) {
    if (m < 1.5) return 'Kích thước thật';
    var u = [[1e15, 'triệu tỉ'], [1e12, 'nghìn tỉ'], [1e9, 'tỉ'], [1e6, 'triệu'], [1e3, 'nghìn']];
    for (var i = 0; i < u.length; i++) if (m >= u[i][0]) return 'Phóng to ' + fmtNum(m / u[i][0]) + ' ' + u[i][1] + ' lần';
    return 'Phóng to ' + Math.round(m) + ' lần';
  }
  function fmtLen(m) {
    var u = [[1e-2, 'cm', 1e2], [1e-3, 'mm', 1e3], [1e-6, 'µm', 1e6], [1e-9, 'nm', 1e9], [1e-12, 'pm', 1e12], [0, 'fm', 1e15]];
    for (var i = 0; i < u.length; i++) if (m >= u[i][0]) return fmtNum(m * u[i][2]) + ' ' + u[i][1];
    return m + ' m';
  }
  function frameWidth() {
    if (z < 0) return LEVELS[0].frame * Math.pow(Z, -z);
    var i = Math.min(Math.floor(z), N - 1), f = z - i;
    if (i >= N - 1) return LEVELS[N - 1].frame / Math.pow(Z, f);
    return LEVELS[i].frame * Math.pow(LEVELS[i + 1].frame / LEVELS[i].frame, f);
  }

  var lvlEl = document.getElementById('lvlName'), magEl = document.getElementById('mag'), capEl = document.getElementById('cap');
  var holdBtn = document.getElementById('hold'), countBox = document.getElementById('count'), countN = document.getElementById('countN');
  var zr = document.getElementById('zr'), track = document.getElementById('track'), hintEl = document.getElementById('hint');
  var titleEl = document.getElementById('objTitle'), picker = document.getElementById('picker');
  var elRow = document.getElementById('elRow'), tempRow = document.getElementById('tempRow');
  var lastNearest = -1, lastCap = '', lastMag = '', speakOn = false, chips = [];

  function captionFor(idx) {
    var Lv = LEVELS[idx];
    if (Lv.kind === 'atom') { if (slow) return Lv.capSlow; if (sinceRelease < 3.5) return Lv.capRelease; }
    var cap = Lv.cap;
    if (Lv.temp) cap += ' ' + (curMat.tempText || TEMP_TEXT[curMat.phase])[tempIdx];
    return cap;
  }
  function speak(text) {
    try {
      if (!('speechSynthesis' in window)) return;
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = 'vi-VN'; u.rate = 0.95;
      var vs = speechSynthesis.getVoices().filter(function (v) { return v.lang && v.lang.toLowerCase().indexOf('vi') === 0; });
      if (vs[0]) u.voice = vs[0];
      speechSynthesis.speak(u);
    } catch (e) {}
  }
  function updateHud() {
    var nearest = nearestLevel();
    if (nearest !== lastNearest) {
      lastNearest = nearest;
      var Lv = LEVELS[nearest];
      lvlEl.textContent = Lv.name;
      for (var c = 0; c < chips.length; c++) chips[c].setAttribute('aria-current', c === nearest ? 'true' : 'false');
      var atAtom = Lv.kind === 'atom';
      holdBtn.hidden = !atAtom; countBox.hidden = !atAtom;
      hintEl.hidden = !Lv.d3;
      tempRow.hidden = !Lv.temp;
      if (!atAtom && slow) setSlow(false);
    }
    var cap = captionFor(nearest);
    if (cap !== lastCap) { lastCap = cap; capEl.textContent = cap; if (speakOn) speak(cap); }
    var w = frameWidth(), m = LEVELS[0].frame / w;
    var mtxt = fmtMag(m) + ' · bề ngang khung ' + fmtLen(w);
    if (mtxt !== lastMag) { lastMag = mtxt; magEl.textContent = mtxt; }
    if (!countBox.hidden) countN.textContent = totalSeen.toLocaleString('vi-VN');
    if (!sliderActive) zr.value = z.toFixed(2);
  }

  // =====================================================================
  // Chọn vật thể, nguyên tố, nhiệt độ
  // =====================================================================
  var pickBtns = [];
  GROUPS.forEach(function (grp) {
    var lab = document.createElement('p'); lab.className = 'eyebrow grp'; lab.textContent = grp[0]; picker.appendChild(lab);
    grp[1].forEach(function (id) {
      var idx = -1;
      for (var k = 0; k < OBJECTS.length; k++) if (OBJECTS[k].id === id) idx = k;
      if (idx < 0) return;
      var o = OBJECTS[idx], m = MATERIALS[o.mat], e = ELEMENTS[m.el];
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'pick'; b.setAttribute('aria-pressed', 'false');
      var sym = document.createElement('span'); sym.className = 'sym'; sym.textContent = m.sym; sym.style.background = m.symColor;
      var nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = o.name;
      var sm = document.createElement('small'); sm.textContent = m.sub || (e.name + ' · ' + e.Z + ' proton'); nm.appendChild(sm);
      b.appendChild(sym); b.appendChild(nm);
      b.addEventListener('click', function () { selectObject(idx); });
      picker.appendChild(b); pickBtns[idx] = b;
    });
  });

  function buildChips() {
    track.textContent = ''; chips = [];
    LEVELS.forEach(function (Lv, idx) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'chip'; b.textContent = Lv.name; b.setAttribute('aria-current', 'false');
      b.addEventListener('click', function () { stopAuto(); target = idx === 0 ? ZMIN : idx; });
      track.appendChild(b); chips.push(b);
    });
  }
  function refreshLevels() {
    LEVELS = buildLevels();
    N = LEVELS.length; ZMAX = N - 0.4;
    for (var i = 0; i < N; i++) if (LEVELS[i].kind === 'atom') ATOM = i;
    zr.max = String(ZMAX);
    buildChips();
    lastNearest = -1; lastCap = ''; lastMag = '';
  }
  function setElement(ek) {
    curElKey = ek; curEl = ELEMENTS[ek];
    pts = []; pings = [];
    refreshLevels();
    buildElRow();
    renderSlots();
  }
  function buildElRow() {
    elRow.textContent = '';
    var els = curMat.els || [curMat.el];
    elRow.hidden = els.length < 2;
    if (els.length < 2) return;
    var lab = document.createElement('span'); lab.className = 'eyebrow';
    lab.textContent = curMat.structure === 'air' ? 'Bám theo phân tử nào?' : 'Lặn vào nguyên tử nào?';
    elRow.appendChild(lab);
    els.forEach(function (ek) {
      var e = ELEMENTS[ek], b = document.createElement('button');
      b.type = 'button'; b.className = 'chip';
      var dot = document.createElement('span'); dot.className = 'dot'; dot.style.background = PALS[e.pal].chip;
      b.appendChild(dot);
      b.appendChild(document.createTextNode(curMat.structure === 'air' ? e.name + ' (' + e.sym + '₂)' : e.name + ' (' + e.sym + ')'));
      b.setAttribute('aria-current', ek === curElKey ? 'true' : 'false');
      b.addEventListener('click', function () { if (ek !== curElKey) setElement(ek); });
      elRow.appendChild(b);
    });
  }
  function buildTempRow() {
    tempRow.textContent = '';
    var lab = document.createElement('span'); lab.className = 'eyebrow'; lab.textContent = 'Nhiệt độ';
    tempRow.appendChild(lab);
    ['Lạnh cóng', 'Nhiệt độ phòng', 'Nóng'].forEach(function (t, k) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'chip'; b.textContent = t;
      b.setAttribute('aria-current', k === tempIdx ? 'true' : 'false');
      b.addEventListener('click', function () {
        tempIdx = k;
        var bs = tempRow.querySelectorAll('.chip');
        for (var i = 0; i < bs.length; i++) bs[i].setAttribute('aria-current', i === k ? 'true' : 'false');
        lastCap = '';
      });
      tempRow.appendChild(b);
    });
  }
  function selectObject(idx) {
    var oldKind = LEVELS ? LEVELS[nearestLevel()].kind : null, frac = z - Math.round(z);
    cur = OBJECTS[idx]; curMat = MATERIALS[cur.mat];
    curElKey = curMat.el; curEl = ELEMENTS[curElKey];
    curLatKey = curMat.lattice || 'bcc'; curLat = LATTICES[curLatKey];
    pts = []; pings = [];
    refreshLevels();
    // giữ nguyên độ sâu theo loại tầng khi đổi vật (ví dụ đang ở hạt nhân thì vẫn ở hạt nhân)
    if (oldKind) {
      var ni = -1;
      for (var i = 0; i < N; i++) if (LEVELS[i].kind === oldKind) ni = i;
      if (ni < 0) ni = clamp(Math.round(z), 0, N - 1);
      z = target = clamp(ni + frac, ZMIN, ZMAX);
      if (ni === 0 && z < 0.01) z = target = ZMIN;
    }
    titleEl.textContent = cur.title;
    for (var p = 0; p < pickBtns.length; p++) pickBtns[p].setAttribute('aria-pressed', p === idx ? 'true' : 'false');
    buildElRow();
    loadFolderImages();
    updateLibHead();
    renderSlots();
  }

  // =====================================================================
  // Điều khiển
  // =====================================================================
  var sliderActive = false;
  zr.addEventListener('input', function () { stopAuto(); sliderActive = true; target = +zr.value; });
  zr.addEventListener('change', function () { sliderActive = false; });
  zr.addEventListener('pointerup', function () { sliderActive = false; });

  var ptrs = new Map(), pinchD = 0, dragY = 0, dragX = 0;
  stage.addEventListener('pointerdown', function (e) {
    if (e.target === holdBtn) return;
    stopAuto();
    try { stage.setPointerCapture(e.pointerId); } catch (err) {}
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (ptrs.size === 2) { var p = Array.from(ptrs.values()); pinchD = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y); rot.drag = false; }
    dragY = e.clientY; dragX = e.clientX; rot.vy = rot.vp = 0;
  });
  stage.addEventListener('pointermove', function (e) {
    if (!ptrs.has(e.pointerId)) return;
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (ptrs.size === 2) {
      var p = Array.from(ptrs.values()), d = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
      if (pinchD > 0) target = clamp(target + Math.log(d / pinchD) / Math.log(Z), ZMIN, ZMAX);
      pinchD = d;
    } else if (ptrs.size === 1) {
      if (is3D()) {
        var dx = e.clientX - dragX, dy = e.clientY - dragY;
        rot.drag = true;
        rot.yaw += dx * 0.009; rot.pitch = clamp(rot.pitch + dy * 0.009, -1.2, 1.2);
        rot.vy = clamp(dx * 0.009 * 30, -3, 3); rot.vp = clamp(dy * 0.009 * 30, -3, 3);
        limitTilt();
      } else {
        target = clamp(target + (dragY - e.clientY) / (V.H * 0.55), ZMIN, ZMAX);
      }
      dragY = e.clientY; dragX = e.clientX;
    }
  });
  function endPtr(e) {
    ptrs.delete(e.pointerId); pinchD = 0; rot.drag = false;
    if (ptrs.size === 1) { var q = Array.from(ptrs.values())[0]; dragY = q.y; dragX = q.x; }
  }
  stage.addEventListener('pointerup', endPtr);
  stage.addEventListener('pointercancel', endPtr);
  stage.addEventListener('wheel', function (e) { e.preventDefault(); stopAuto(); target = clamp(target - e.deltaY * 0.0022, ZMIN, ZMAX); }, { passive: false });

  function setSlow(on) {
    if (on === slow) return;
    slow = on;
    holdBtn.classList.toggle('on', on);
    holdBtn.textContent = on ? 'Đang quay chậm…' : 'Giữ để quay chậm';
    var now = performance.now() / 1000;
    if (on) { for (var i = 0; i < pts.length; i++) { var age = now - pts[i].b; pts[i].life = Math.min(pts[i].life, age + 0.35); } }
    else sinceRelease = 0;
  }
  holdBtn.addEventListener('pointerdown', function (e) {
    e.stopPropagation(); stopAuto();
    try { holdBtn.setPointerCapture(e.pointerId); } catch (err) {}
    tick(false); setSlow(true);
  });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(function (ev) { holdBtn.addEventListener(ev, function () { setSlow(false); }); });
  holdBtn.addEventListener('keydown', function (e) { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); setSlow(true); } });
  holdBtn.addEventListener('keyup', function (e) { if (e.key === ' ' || e.key === 'Enter') setSlow(false); });

  var auto = { on: false, waitStart: 0 }, autoSlowing = false;
  var btnAuto = document.getElementById('btnAuto');
  function stopAuto() {
    if (!auto.on) return;
    auto.on = false; btnAuto.setAttribute('aria-pressed', 'false'); btnAuto.textContent = 'Lặn tự động';
    rot.demo = null;
    if (autoSlowing) { autoSlowing = false; setSlow(false); }
  }
  btnAuto.addEventListener('click', function () {
    if (auto.on) { stopAuto(); return; }
    auto.on = true; auto.waitStart = 0;
    btnAuto.setAttribute('aria-pressed', 'true'); btnAuto.textContent = 'Dừng lặn';
    if (z > N - 1.2) { z = ZMIN; target = ZMIN; }
    target = z < 0 ? ZMIN : Math.round(z);
  });
  function runAuto(now) {
    if (!auto.on) return;
    if (Math.abs(z - target) > 0.02) return;
    var lvl = clamp(Math.round(target), 0, N - 1), Lv = LEVELS[lvl];
    if (!auto.waitStart) { auto.waitStart = now; if (Lv.kind === 'atom') { autoSlowing = true; setSlow(true); } }
    var el = now - auto.waitStart;
    if (Lv.kind === 'atom' && autoSlowing && el > 4.5) { autoSlowing = false; setSlow(false); }
    var demo3d = Lv.d3 && Lv.kind !== 'atom';
    var wait = Lv.kind === 'atom' ? 9 : (demo3d || Lv.temp) ? 7 : 3.2;
    rot.demo = demo3d ? (el < wait * 0.6 ? [0.8, 0.5] : [0, 0]) : null;
    if (el > wait) { auto.waitStart = 0; if (lvl < N - 1) target = lvl + 1; else stopAuto(); }
  }

  document.getElementById('btnTop').addEventListener('click', function () { stopAuto(); target = ZMIN; });
  var btnSpeak = document.getElementById('btnSpeak');
  if (!('speechSynthesis' in window)) btnSpeak.hidden = true;
  btnSpeak.addEventListener('click', function () {
    speakOn = !speakOn;
    btnSpeak.setAttribute('aria-pressed', speakOn ? 'true' : 'false');
    btnSpeak.textContent = speakOn ? 'Đang đọc to' : 'Đọc to';
    if (speakOn) speak(lastCap); else { try { speechSynthesis.cancel(); } catch (e) {} }
  });

  // =====================================================================
  // Thư viện ảnh
  // =====================================================================
  var libEl = document.getElementById('lib'), slotsEl = document.getElementById('slots'), btnLib = document.getElementById('btnLib');
  function updateLibHead() {
    document.getElementById('libTitle').textContent = 'Thư viện ảnh: ' + cur.title.toLowerCase();
    var intro = document.getElementById('libIntro'), names = LEVELS.filter(function (l) { return l.img; }).map(function (l) { return l.id; });
    intro.textContent = '';
    intro.appendChild(document.createTextNode('Các tầng ảnh thay được bằng ảnh ChatGPT; các tầng sâu luôn vẽ bằng code để đúng khoa học và chuyển động được. Ảnh vuông là tốt nhất. Ảnh chọn ở đây chỉ lưu trong trình duyệt này. Muốn mọi máy đều thấy thì đưa ảnh lên GitHub, vào thư mục '));
    var b = document.createElement('b'); b.textContent = 'anh/' + cur.id + '/'; intro.appendChild(b);
    intro.appendChild(document.createTextNode(', đặt tên ' + names.join(', ') + '.'));
  }
  btnLib.addEventListener('click', function () {
    var open = libEl.hidden;
    libEl.hidden = !open;
    btnLib.setAttribute('aria-pressed', open ? 'true' : 'false');
    if (open) { renderSlots(); libEl.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  });
  function thumbCanvas(idx) {
    var c = canvas(176), g = c.getContext('2d'), v = { W: 176, H: 176, cx: 88, cy: 88, M: 176, HD: 124.5 };
    try { LEVELS[idx].draw(g, v, idx === 0 ? 0.75 : 1, performance.now() / 1000); } catch (e) {}
    return c;
  }
  function renderSlots() {
    if (libEl.hidden) return;
    slotsEl.textContent = '';
    LEVELS.forEach(function (Lv, idx) {
      var row = document.createElement('div'); row.className = 'slot';
      var th = document.createElement('div'); th.className = 'thumb';
      var im = Lv.img && images[key(Lv.id)];
      if (im) { var ii = document.createElement('img'); ii.alt = ''; ii.src = im.img.src; th.appendChild(ii); }
      else th.appendChild(thumbCanvas(idx));
      var body = document.createElement('div'); body.className = 'body';
      var nm = document.createElement('div'); nm.className = 'name'; nm.textContent = (idx + 1) + '. ' + Lv.name; body.appendChild(nm);
      if (!Lv.img) {
        var fx = document.createElement('p'); fx.className = 'fixed-note'; fx.textContent = Lv.fixed || ''; body.appendChild(fx);
      } else {
        var st = document.createElement('div'); st.className = 'state';
        st.textContent = im ? (im.own ? 'Đang dùng ảnh của anh' : 'Đang dùng ảnh trong thư mục') : 'Đang dùng hình vẽ bằng code';
        body.appendChild(st);
        var acts = document.createElement('div'); acts.className = 'acts';
        var fin = document.createElement('input'); fin.type = 'file'; fin.accept = 'image/*'; fin.id = 'file-' + cur.id + '-' + Lv.id;
        var lab = document.createElement('label'); lab.className = 'btn'; lab.htmlFor = fin.id; lab.textContent = im ? 'Đổi ảnh' : 'Chọn ảnh';
        fin.addEventListener('change', function () {
          var file = fin.files && fin.files[0];
          if (!file) return;
          idbPut(key(Lv.id), file);
          setOwnImage(key(Lv.id), file);
        });
        acts.appendChild(fin); acts.appendChild(lab);
        if (im && im.own) {
          var del = document.createElement('button'); del.type = 'button'; del.className = 'btn'; del.textContent = 'Bỏ ảnh của anh';
          del.addEventListener('click', function () {
            var k = key(Lv.id);
            idbDel(k);
            if (images[k] && images[k].url) { try { URL.revokeObjectURL(images[k].url); } catch (e) {} }
            delete images[k]; folderTried[cur.id] = false; loadFolderImages(); renderSlots();
          });
          acts.appendChild(del);
        }
        body.appendChild(acts);
        if (Lv.prompt) {
          var det = document.createElement('details');
          var sm = document.createElement('summary'); sm.textContent = 'Lệnh vẽ ảnh này bằng ChatGPT';
          var ta = document.createElement('textarea'); ta.readOnly = true; ta.value = Lv.prompt; ta.id = 'prompt-' + cur.id + '-' + Lv.id;
          var cp = document.createElement('button'); cp.type = 'button'; cp.className = 'btn'; cp.textContent = 'Chép lệnh'; cp.style.marginTop = '8px';
          cp.addEventListener('click', function () {
            function fallback() { ta.focus(); ta.select(); cp.textContent = 'Đã bôi đen, bấm Ctrl+C'; }
            try { navigator.clipboard.writeText(Lv.prompt).then(function () { cp.textContent = 'Đã chép'; setTimeout(function () { cp.textContent = 'Chép lệnh'; }, 1800); }, fallback); }
            catch (e) { fallback(); }
          });
          det.appendChild(sm); det.appendChild(ta); det.appendChild(cp);
          body.appendChild(det);
        }
      }
      row.appendChild(th); row.appendChild(body);
      slotsEl.appendChild(row);
    });
  }

  // =====================================================================
  // Vòng lặp
  // =====================================================================
  var lastT = 0;
  function frame(ms) {
    requestAnimationFrame(frame);
    var now = ms / 1000, dt = lastT ? Math.min(now - lastT, 0.05) : 0.016;
    lastT = now;
    z += (target - z) * Math.min(1, dt * (auto.on ? 1.15 : 4.5));
    if (Math.abs(target - z) < 0.0005) z = target;
    runAuto(now);
    updateRot(dt);
    var st = curMat.structure;
    if (st === 'water' && z > 0.6) liqStep(dt);
    if ((st === 'air' || st === 'steam') && z > -0.2) gasStep(dt);
    updateElectrons(dt, now, z > ATOM - 1.6 && z < ATOM + 1.6);
    if (z > ATOM + 0.3 && z < ATOM + 2.1 && Math.random() < dt * 2.5) blips.push({ x: Math.random(), y: Math.random(), b: now });
    for (var i = blips.length - 1; i >= 0; i--) if (now - blips[i].b > 0.5) blips.splice(i, 1);
    render(now);
    updateHud();
  }

  buildTempRow();
  selectObject(0);
  window.addEventListener('resize', resize);
  resize();
  updateHud();
  requestAnimationFrame(frame);
  idbOpen().then(function () { idbLoadAll(function (k, blob) { if (String(k).indexOf(':') > 0) setOwnImage(String(k), blob); }); });
})();
</script>
